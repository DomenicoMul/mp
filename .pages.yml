media:
  input: assets/images
  output: /assets/images

content:
  - name: posts
    label: "Articoli"
    type: collection
    path: "_posts/{fields.categories}"
    filename: "{year}-{month}-{day}-{slug}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Titolo
        type: string
        required: true

      - name: sub-title
        label: Sottotitolo
        type: string

      - name: date
        label: Data
        type: date
        required: true

      - name: categories
        label: Categoria
        type: select
        required: true
        options:
          values:
            - name: eventi
            - label: Eventi
            - name: media
            - label: Media
            - name: pillowle
            - label: Pillo(w)le
            - name: pubblicazioni
            - label: Pubblicazioni
            

      - name: tags
        label: Temi
        type: select
        required: true
        options:
          values:
            - name: AI
            - name: PA Post-Digitale           
            - name: Futuro         
            - name: Persone          
            - name: Formazione
        

      - name: cover
        label: Immagine di Copertina
        type: image
        required: true

      - name: description
        label: Descrizione
        type: text

      - name: body
        label: Contenuto
        type: rich-text