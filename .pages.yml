media:
  input: assets/images
  output: /assets/images

content:
  - name: posts
    label: "Articoli"
    type: collection
    path: "_posts/{fields.categories}"
    filename: "{year}-{month}-{day}-{slug}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Titolo
        type: string
        required: true

      - name: sub-title
        label: Sottotitolo
        type: string

      - name: date
        label: Data
        type: date
        required: true

      - name: categories
        label: Categoria
        type: select
        required: true
        options:
          values:
            - eventi
            - media
            - pillowle
            - pubblicazioni

      - name: tags
        label: Tema
        type: select
        multiple: true
        options:
          values:
            - AI
            - PA Post-digitale
            - Persone
            - Futuro
            - Formazione

      - name: cover
        label: Immagine di Copertina
        type: image
        required: true

      - name: description
        label: Descrizione
        type: text

      - name: body
        label: Contenuto
        type: rich-text