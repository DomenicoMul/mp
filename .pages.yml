media:
  input: assets/images
  output: /assets/images

content:
  - name: posts
    label: "Articoli"
    type: collection
    path: "_posts/{fields.categories}"
    filename: "{year}-{month}-{day}-{slug}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Titolo
        type: string
        required: true

      - name: sub-title 
        label: Sottotitolo
        type: string

      - name: date
        label: Data
        type: date
        required: true

      - name: categories
        label: Categoria
        type: select
        required: true
        options:
          values:
            - name: eventi
              label: Eventi
            - name: media
              label: Media
            - name: pillowle
              label: Pillo(w)le
            - name: pubblicazioni
              label: Pubblicazioni
    
      - name: tags
        label: Temi
        type: list
        field:
          type: select
          options:
            - label: AI
              value: AI
            - label: PA Post-Digitale
              value: PA Post-Digitale
            - label: Futuro
              value: Futuro
            - label: Persone
              value: Persone
            - label: Formazione
              value: Formazione
          

      - name: cover
        label: Immagine di Copertina
        type: image
        required: true

      - name: description
        label: Descrizione
        type: text

      - name: body
        label: Contenuto
        type: rich-text
