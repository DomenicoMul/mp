name: Aggiorna indice post Markdown

on:
  push:
    branches:
      - main # o master, a seconda del branch principale

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa dipendenze (gray-matter)
        run: npm install gray-matter

      - name: Esegui lo script di generazione JSON
        run: node generate-index.js

      - name: Committa e spuisci il posts.json aggiornato
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add posts.json
          git commit -m "Auto-aggiornamento posts.json [skip ci]" || exit 0
          git push