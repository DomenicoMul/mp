<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fumetto 3D Flipbook - Lettura RTL</title>
    <style>
        :root {
            --bg-color: #121216;
            --book-bg: #fff;
            --accent-color: #e50914;
            --page-width: 32vw;
            --page-height: 85vh;
            --max-page-w: 600px;
            --max-page-h: 1066px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 30%, #20202e 0%, #111116 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Top Bar */
        header {
            width: 100%;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .comic-title {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #f0f0f0;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .comic-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 18px;
            background: var(--accent-color);
            border-radius: 2px;
        }

        .btn-characters {
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(0, 210, 255, 0.3);
            transition: all 0.3s ease;
        }

        .btn-characters:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 210, 255, 0.5);
        }

        .rtl-badge {
            font-size: 0.75rem;
            background: rgba(229, 9, 20, 0.2);
            color: #ff5252;
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(229, 9, 20, 0.4);
            font-weight: 600;
        }

        /* Pannello Personaggi */
        .characters-panel {
            position: fixed;
            top: -420px;
            left: 0;
            width: 100%;
            height: 400px;
            background: rgba(18, 18, 22, 0.95);
            backdrop-filter: blur(15px);
            border-bottom: 2px solid #00d2ff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            z-index: 200;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            padding: 20px 30px;
        }

        .characters-panel.open {
            top: 0;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .panel-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #00d2ff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .close-panel-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: background 0.2s;
        }

        .close-panel-btn:hover {
            background: var(--accent-color);
        }

        .cards-container {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding: 10px 5px 20px 5px;
            align-items: center;
            height: 100%;
            scroll-behavior: smooth;
        }

        .cards-container::-webkit-scrollbar {
            height: 8px;
        }

        .cards-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .cards-container::-webkit-scrollbar-thumb {
            background: #00d2ff;
            border-radius: 4px;
        }

        .card-item {
            flex: 0 0 180px;
            height: 260px;
            background: #1a1a24;
            border-radius: 12px;
            border: 2px solid rgba(0, 210, 255, 0.3);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .card-item:hover {
            transform: translateY(-8px) scale(1.03);
            border-color: #00d2ff;
            box-shadow: 0 12px 25px rgba(0, 210, 255, 0.4);
        }

        .card-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-info {
            padding: 10px;
            text-align: center;
            background: #121216;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-name {
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
        }

        .card-role {
            font-size: 0.75rem;
            color: #00d2ff;
        }

        /* Popup Modale */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 300;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #1a1a24;
            border: 2px solid #00d2ff;
            border-radius: 16px;
            width: 90%;
            max-width: 550px;
            padding: 25px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            display: flex;
            gap: 20px;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: var(--accent-color);
        }

        .modal-img {
            width: 160px;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .modal-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .modal-name {
            font-size: 1.4rem;
            color: #00d2ff;
            margin-bottom: 5px;
        }

        .modal-role {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-desc {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #ddd;
        }

        /* Main Book Area */
        .viewport {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 2200px;
            position: relative;
            padding: 10px;
        }

        .book-wrapper {
            position: relative;
            width: calc(var(--page-width) * 2);
            height: var(--page-height);
            max-width: calc(var(--max-page-w) * 2);
            max-height: var(--max-page-h);
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 25px 35px rgba(0,0,0,0.7));
        }

        /* Central Spine Shadow Effect */
        .spine-shadow {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 100%;
            background: linear-gradient(
                90deg, 
                rgba(0,0,0,0.5) 0%, 
                rgba(0,0,0,0.8) 50%, 
                rgba(0,0,0,0.5) 100%
            );
            z-index: 50;
            pointer-events: none;
            opacity: 0.6;
        }

        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
        }

        /* Page Component */
        .page-leaf {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
        }

        .page-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background-color: var(--book-bg);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Front Face (Right Side) */
        .page-face.front {
            z-index: 2;
        }

        /* Back Face (Left Side when Flipped) */
        .page-face.back {
            transform: rotateY(180deg);
            z-index: 1;
        }

        .page-face img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
        }

        /* Inner Shadow on Page Turn */
        .page-face::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            pointer-events: none;
            transition: opacity 0.8s ease;
            opacity: 0;
        }

        .page-face.front::after {
            left: 0;
            background: linear-gradient(to right, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 15%);
        }

        .page-face.back::after {
            right: 0;
            background: linear-gradient(to left, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 15%);
        }

        .page-leaf.flipped .page-face::after {
            opacity: 1;
        }

        /* Flipped State for RTL (Rotates Left) */
        .page-leaf.flipped {
            transform: rotateY(-180deg);
        }

        /* Navigation Arrows Overlay */
        .nav-overlay-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 90px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 90;
            border-radius: 8px;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
        }

        .nav-overlay-btn:hover {
            background: rgba(229, 9, 20, 0.8);
            border-color: transparent;
            transform: translateY(-50%) scale(1.05);
        }

        .nav-overlay-btn.left {
            left: 20px;
        }

        .nav-overlay-btn.right {
            right: 20px;
        }

        .nav-overlay-btn svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        /* Bottom Controls Bar */
        footer {
            width: 100%;
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 100;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s ease;
        }

        .ctrl-btn:hover {
            background: var(--accent-color);
        }

        .progress-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .progress-bar-wrapper {
            flex: 1;
            position: relative;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            cursor: pointer;
        }

        .progress-fill {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            background: var(--accent-color);
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .page-counter {
            font-size: 0.9rem;
            color: #bbb;
            font-variant-numeric: tabular-nums;
            min-width: 110px;
            text-align: center;
        }

        /* Mobile Adaptations */
        @media (max-width: 850px) {
            :root {
                --page-width: 88vw;
                --page-height: 75vh;
            }

            .book-wrapper {
                width: var(--page-width);
            }

            .page-leaf {
                width: 100%;
            }

            .spine-shadow {
                display: none;
            }

            .nav-overlay-btn {
                width: 44px;
                height: 60px;
            }

            .nav-overlay-btn.left { left: 5px; }
            .nav-overlay-btn.right { right: 5px; }

            .modal-content {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .modal-img {
                width: 120px;
                height: 160px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="comic-title">
                <span>Fumetto Reader HD</span>
            </div>
            <button class="btn-characters" id="toggle-panel-btn">
                <span>✨</span> Scopri i personaggi
            </button>
        </div>
        <div class="rtl-badge">Sfogliamento da Destra a Sinistra (RTL)</div>
    </header>

    <!-- Pannello Personaggi dall'alto -->
    <div class="characters-panel" id="characters-panel">
        <div class="panel-header">
            <span class="panel-title">I Protagonisti del Pianeta Innovazione</span>
            <button class="close-panel-btn" id="close-panel-btn">✕</button>
        </div>
        <div class="cards-container" id="cards-container">
            <!-- Figurine generate da JS -->
        </div>
    </div>

    <!-- Modal Scheda Personaggio -->
    <div class="modal-overlay" id="char-modal">
        <div class="modal-content">
            <button class="modal-close" id="close-modal-btn">✕</button>
            <img class="modal-img" id="modal-img" src="" alt="Personaggio">
            <div class="modal-body">
                <h2 class="modal-name" id="modal-name"></h2>
                <div class="modal-role" id="modal-role"></div>
                <p class="modal-desc" id="modal-desc"></p>
            </div>
        </div>
    </div>

    <div class="viewport">
        <!-- Arrow Left: Next Page (In RTL mode, moving left progresses the comic) -->
        <button class="nav-overlay-btn left" id="btn-prev" title="Pagina Successiva (Freccia Sinistra)">
            <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>

        <div class="book-wrapper">
            <div class="spine-shadow"></div>
            <div class="book" id="book-container">
                <!-- Direct HTML-rendered Pages -->
            </div>
        </div>

        <!-- Arrow Right: Previous Page -->
        <button class="nav-overlay-btn right" id="btn-next" title="Pagina Precedente (Freccia Destra)">
            <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
    </div>

    <footer>
        <button class="ctrl-btn" id="btn-first">Inizio</button>
        
        <div class="progress-container">
            <div class="progress-bar-wrapper" id="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span class="page-counter" id="page-counter">Pagina 1 di 16</span>
        </div>

        <button class="ctrl-btn" id="btn-last">Fine</button>
    </footer>

    <script>

               img: "assets/images/fumetto/personaggi/08.jpg"
            },
            {

                desc: "Paese:<br>ISOLA BABELION<br><br>Connotati e segni particolari:<br>MENTE CAOTICA, BARBA E CAPELLI MOLTO FOLTI<br><br>Superpoteri:<br>FRANTUMAZIONE DEL SENSO, GENERAZIONE CAOTICA INFINITA",
                img: "assets/images/fumetto/personaggi/09.jpg"

        ];

        // Immagini del fumetto
        const comicPages = [
            "assets/images/fumetto/01.jpg",
            "assets/images/fumetto/02.png",
            "assets/images/fumetto/03.png",

            "assets/images/fumetto/11.png",
            "assets/images/fumetto/12.png",

        let currentSpread = 0;
        const totalPages = comicPages.length;
        const totalLeaves = Math.ceil(totalPages / 2);

        const bookContainer = document.getElementById('book-container');
        const btnNext = document.getElementById('btn-next');
        const btnPrev = document.getElementById('btn-prev');
        const btnFirst = document.getElementById('btn-first');

        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const pageCounter = document.getElementById('page-counter');

        // Elementi Pannello e Modal
        const togglePanelBtn = document.getElementById('toggle-panel-btn');
        const closePanelBtn = document.getElementById('close-panel-btn');
        const charactersPanel = document.getElementById('characters-panel');
        const cardsContainer = document.getElementById('cards-container');

        const charModal = document.getElementById('char-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const modalImg = document.getElementById('modal-img');
        const modalName = document.getElementById('modal-name');
        const modalRole = document.getElementById('modal-role');
        const modalDesc = document.getElementById('modal-desc');

        // Inizializza Figurine Personaggi
        function initCharacters() {
            cardsContainer.innerHTML = '';
            charactersData.forEach(char => {
                const card = document.createElement('div');
                card.className = 'card-item';
                card.innerHTML = `
                    <img src="${char.img}" alt="${char.name}">
                    <div class="card-info">
                        <div class="card-name">${char.name}</div>
                        <div class="card-role">${char.role}</div>
                    </div>
                `;
                card.addEventListener('click', () => openModal(char));
                cardsContainer.appendChild(card);
            });
        }

        // Toggle Pannello
        togglePanelBtn.addEventListener('click', () => {
            charactersPanel.classList.toggle('open');
        });

        closePanelBtn.addEventListener('click', () => {
            charactersPanel.classList.remove('open');
        });

        // Modal Handlers
        


function openModal(char) {
    modalImg.src = char.img;
    modalName.textContent = char.name;
    modalRole.textContent = char.role;
    modalDesc.innerHTML = char.desc; // <-- IMPORTANTE: usa innerHTML e non textContent
    charModal.classList.add('active');
}


        closeModalBtn.addEventListener('click', () => {
            charModal.classList.remove('active');
        });

        charModal.addEventListener('click', (e) => {
            if (e.target === charModal) {
                charModal.classList.remove('active');
            }
        });

        // Genera la struttura 3D dei fogli
        function buildBook() {
            bookContainer.innerHTML = '';
            
            for (let i = 0; i < totalLeaves; i++) {
                const leaf = document.createElement('div');
                leaf.className = 'page-leaf';
                leaf.dataset.index = i;
                
                const rightPageIndex = i * 2;
                const leftPageIndex = i * 2 + 1;

                const frontImg = comicPages[rightPageIndex] || '';
                const backImg = comicPages[leftPageIndex] || '';

                leaf.innerHTML = `
                    <div class="page-face front">
                        ${frontImg ? `<img src="${frontImg}" alt="Pagina ${rightPageIndex + 1}">` : ''}
                    </div>
                    <div class="page-face back">
                        ${backImg ? `<img src="${backImg}" alt="Pagina ${leftPageIndex + 1}">` : ''}
                    </div>
                `;

                leaf.addEventListener('click', (e) => {
                    const rect = leaf.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    if (clickX > rect.width / 2) {
                        nextPage();
                    } else {
                        prevPage();
                    }
                });

                bookContainer.appendChild(leaf);
            }

            updateBookState();
        }

        function updateBookState() {
            const leaves = document.querySelectorAll('.page-leaf');

            leaves.forEach((leaf, idx) => {
                if (idx < currentSpread) {
                    leaf.classList.add('flipped');
                    leaf.style.zIndex = idx + 1;
                } else {
                    leaf.classList.remove('flipped');
                    leaf.style.zIndex = totalLeaves - idx;
                }
            });

            let displayedPageText = "";
            const activeRight = currentSpread * 2 + 1;
            const activeLeft = currentSpread * 2 + 2;

            if (currentSpread === 0) {
                displayedPageText = `Pagina 1 di ${totalPages}`;
            } else if (activeLeft <= totalPages) {
                displayedPageText = `Pagine ${activeRight}-${activeLeft} di ${totalPages}`;
            } else {
                displayedPageText = `Pagina ${activeRight} di ${totalPages}`;
            }

            pageCounter.textContent = displayedPageText;

            const progressPercent = (currentSpread / totalLeaves) * 100;
            progressFill.style.width = `${progressPercent}%`;
        }

        function nextPage() {
            if (currentSpread < totalLeaves) {
                currentSpread++;
                updateBookState();
            }
        }

        function prevPage() {
            if (currentSpread > 0) {
                currentSpread--;
                updateBookState();
            }
        }

        btnNext.addEventListener('click', nextPage);
        btnPrev.addEventListener('click', prevPage);

        btnFirst.addEventListener('click', () => {
            currentSpread = 0;
            updateBookState();
        });

        btnLast.addEventListener('click', () => {
            currentSpread = totalLeaves;
            updateBookState();
        });

        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const clickPos = (rect.right - e.clientX) / rect.width;
            currentSpread = Math.round(clickPos * totalLeaves);
            currentSpread = Math.max(0, Math.min(totalLeaves, currentSpread));
            updateBookState();
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === ' ') {
                nextPage();
            } else if (e.key === 'ArrowRight') {
                prevPage();
            } else if (e.key === 'Home') {
                currentSpread = 0;
                updateBookState();
            } else if (e.key === 'End') {
                currentSpread = totalLeaves;
                updateBookState();
            }
        });

        // Inizializzazione
        initCharacters();
        buildBook();
    </script>
</body>
</html>
