<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title id="page-title">Blog - Articoli</title>
    <!-- Libreria Marked.js per convertire il Markdown in HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; }
        .meta { color: #666; font-size: 0.9em; margin-bottom: 20px; }
        .description { font-style: italic; color: #555; background: #f9f9f9; padding: 15px; border-left: 4px solid #007bff; margin-bottom: 20px; }
        .post-image { max-width: 100%; height: auto; margin-bottom: 20px; }
        .back-link { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #007bff; }
    </style>
</head>
<body>

    <!-- CONTENITORE LISTA ARTICOLI (Mostrato se NON c'è un file selezionato) -->
    <div id="vista-lista" style="display: none;">
        <h1>Articoli della categoria: <span id="nome-categoria" style="color: #007bff;"></span></h1>
        <ul id="lista-articoli">
            <li>Caricamento elenco in corso...</li>
        </ul>
    </div>

    <!-- CONTENITORE SINGOLO ARTICOLO (Mostrato SE c'è un file selezionato nell'URL) -->
    <div id="vista-articolo" style="display: none;">
        <a href="?" class="back-link">&larr; Torna alla lista</a>
        <header>
            <!-- Immagine in evidenza -->
            <img id="immagine-articolo" class="post-image" src="" alt="" style="display: none;">
            
            <h1 id="titolo-articolo">Caricamento titolo...</h1>
            <h3 id="sottotitolo-articolo" style="color: #555; font-weight: normal;"></h3>
            
            <div class="meta">
                Categoria: <strong id="categoria-articolo"></strong> | Data: <span id="data-articolo"></span>
            </div>
            
            <p id="descrizione-articolo" class="description" style="display: none;"></p>
            <hr>
        </header>

        <!-- Corpo principale dell'articolo convertito in HTML -->
        <main id="corpo-articolo">
            <p>Caricamento contenuto in corso...</p>
        </main>
    </div>

    <script>
        // CONFIGURAZIONE CATEGORIA DESIDERATA
        const CATEGORIA_TARGET = "epoidaltronde"; // Cambia qui la categoria che vuoi filtrare

        // Funzione di supporto per estrarre una proprietà specifica dal Frontmatter YAML
        function estraiValoreFrontmatter(testo, chiave) {
            const regex = new RegExp(`^${chiave}:\\s*["']?([^"'\n]+)["']?`, 'm');
            const match = testo.match(regex);
            return match ? match[1].trim() : '';
        }

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const nomeFileSelezionato = urlParams.get('file');

            if (nomeFileSelezionato) {
                // SE C'È UN FILE NELL'URL: Mostra il dettaglio dell'articolo
                document.getElementById('vista-articolo').style.display = 'block';
                document.getElementById('vista-lista').style.display = 'none';
                await caricaSingoloArticolo(nomeFileSelezionato);
            } else {
                // SE NON C'È UN FILE: Mostra la lista filtrata per categoria
                document.getElementById('vista-lista').style.display = 'block';
                document.getElementById('vista-articolo').style.display = 'none';
                document.getElementById('nome-categoria').innerText = CATEGORIA_TARGET;
                await caricaElencoFiltrato(CATEGORIA_TARGET);
            }
        }

        // Funzione 1: Legge la directory da GitHub, scarica i file e filtra per categoria
        async function caricaElencoFiltrato(categoriaDesiderata) {
            const ul = document.getElementById('lista-articoli');
            
            try {
                const apiUrl = 'https://api.github.com/repos/DomenicoMul/mp/contents/content/posts';
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Errore nel recupero della lista file da GitHub');
                
                const files = await response.json();
                ul.innerHTML = '';
                let trovati = 0;

                for (const file of files) {
                    if (file.name.endsWith('.md')) {
                        // Scarica il file per leggere il Frontmatter
                        const resFile = await fetch(file.download_url);
                        const testoMarkdown = await resFile.text();

                        const categoriaFile = estraiValoreFrontmatter(testoMarkdown, 'category');
                        const titoloFile = estraiValoreFrontmatter(testoMarkdown, 'title') || file.name;

                        // Controlla se la categoria corrisponde
                        if (categoriaFile.toLowerCase() === categoriaDesiderata.toLowerCase()) {
                            /*
                            trovati++;
                            const li = document.createElement('li');
                            // Il link ricarica la pagina passando il nome del file nei parametri URL
                            li.innerHTML = `<a href="?file=${file.name}"><strong>${titoloFile}</strong></a>`;
                            ul.appendChild(li);
                            */

                            const postDiv = document.createElement('div');
                            postDiv.className = 'post-id';
                            postDiv.setAttribute('data-category', categoria);
                            
                            postDiv.innerHTML = `
                                <div class="book-inner" style="align-items: stretch;">
                                    <div class="temi-news-left" id="anno">
                                        <span>${categoriaFile}</span>
                                    </div>
                                    <div class="temi-news-right" id="titolo">                       
                                        <a href="?file=${file.name}" style="text-decoration: none; color: inherit;">
                                            <h3 style="margin: 0; font-size: 1.1rem;">${titolo}</h3>
                                        </a>
                                    </div>
                                </div>
                                <hr style="border: none; height: 1px; background-color: #d1d0d0;">
                            `;
                            
                            contenitore.appendChild(postDiv);







                        }
                    }
                }

                if (trovati === 0) {
                    ul.innerHTML = `<li>Nessun articolo trovato per la categoria "${categoriaDesiderata}".</li>`;
                }

            } catch (error) {
                console.error('Errore:', error);
                ul.innerHTML = `<li style="color: red;">Impossibile caricare l'elenco degli articoli.</li>`;
            }
        }

        // Funzione 2: Carica e mostra il singolo articolo selezionato
        async function caricaSingoloArticolo(nomeFile) {
            try {
                const urlFile = `https://raw.githubusercontent.com/DomenicoMul/mp/refs/heads/main/content/posts/${nomeFile}`;
                
                const response = await fetch(urlFile);
                if (!response.ok) throw new Error('Impossibile trovare il file dell\'articolo');

                const fileText = await response.text();

                // Estrae i metadati correggendo i nomi dei campi coerentemente col tuo Markdown
                const linkImg = estraiValoreFrontmatter(fileText, 'img-link');
                const titolo = estraiValoreFrontmatter(fileText, 'title');
                const sottotitolo = estraiValoreFrontmatter(fileText, 'sub-title');            
                const categoria = estraiValoreFrontmatter(fileText, 'category');
                const data = estraiValoreFrontmatter(fileText, 'date');
                const descrizione = estraiValoreFrontmatter(fileText, 'description');

                // Inserisce i metadati negli elementi HTML corretti
                if (linkImg) {
                    const imgEl = document.getElementById('immagine-articolo');
                    imgEl.src = linkImg;
                    imgEl.style.display = 'block';
                }
                if (titolo) {
                    document.getElementById('titolo-articolo').innerText = titolo;
                    document.getElementById('page-title').innerText = titolo;
                }
                if (sottotitolo) document.getElementById('sottotitolo-articolo').innerText = sottotitolo;
                if (categoria) document.getElementById('categoria-articolo').innerText = categoria;
                if (data) document.getElementById('data-articolo').innerText = data;
                
                if (descrizione) {
                    const descEl = document.getElementById('descrizione-articolo');
                    descEl.innerText = descrizione;
                    descEl.style.display = 'block';
                }

                // Isola il corpo del testo rimuovendo il Frontmatter YAML
                let corpoMarkdown = fileText;
                if (fileText.startsWith('---')) {
                    const parti = fileText.split('---');
                    if (parti.length >= 3) {
                        corpoMarkdown = parti.slice(2).join('---').trim();
                    }
                }

                // Converte il Markdown in HTML e lo inserisce nella pagina
                document.getElementById('corpo-articolo').innerHTML = marked.parse(corpoMarkdown);

            } catch (error) {
                console.error('Errore:', error);
                document.getElementById('vista-articolo').innerHTML = `<h2 style="color: red;">Impossibile caricare l'articolo.</h2><p>${error.message}</p>`;
            }
        }

        // Avvia l'applicazione al caricamento
        init();
    </script>
</body>
</html>
