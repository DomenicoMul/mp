<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Visualizza Articolo</title>
    <!-- Libreria Marked.js per convertire il corpo del Markdown in HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <header>
        <h1 id="titolo-articolo">Caricamento titolo...</h1>
        <p><strong>Categoria:</strong> <span id="categoria-articolo"></span> | <strong>Data:</strong> <span id="data-articolo"></span></p>
        <p id="descrizione-articolo" style="font-style: italic; color: #555;"></p>
        <hr>
    </header>

    <!-- Contenuto principale dell'articolo convertito in HTML -->
    <main id="corpo-articolo">
        <p>Caricamento contenuto in corso...</p>
    </main>

    <script>
        // Funzione per estrarre una proprietà specifica dal Frontmatter YAML
        function estraiValoreFrontmatter(testo, chiave) {
            const regex = new RegExp(`^${chiave}:\\s*["']?([^"'\n]+)["']?`, 'm');
            const match = testo.match(regex);
            return match ? match[1].trim() : '';
        }

        async function caricaArticoloCompleto() {
            try {
                // Sostituisci questo URL con il download_url dinamico del file scelto
                const urlFile = 'https://raw.githubusercontent.com/DomenicoMul/mp/refs/heads/main/content/posts/2026-10-05-test2.md';
                
                const response = await fetch(urlFile);
                if (!response.ok) throw new Error('Errore nel caricamento del file');

                const fileText = await response.text();

                // 1. Estraiamo i metadati dal Frontmatter
                const titolo = estraiValoreFrontmatter(fileText, 'title');
                const categoria = estraiValoreFrontmatter(fileText, 'category');
                const data = estraiValoreFrontmatter(fileText, 'date');
                const descrizione = estraiValoreFrontmatter(fileText, 'description');

                // Inseriamo i metadati negli elementi HTML dedicati
                document.getElementById('titolo-articolo').innerText = titolo;
                document.getElementById('categoria-articolo').innerText = categoria;
                document.getElementById('data-articolo').innerText = data;
                document.getElementById('descrizione-articolo').innerText = descrizione;

                // 2. Isoliamo il corpo del testo (tutto ciò che sta dopo il secondo blocco "---")
                let corpoMarkdown = fileText;
                if (fileText.startsWith('---')) {
                    const parti = fileText.split('---');
                    if (parti.length >= 3) {
                        corpoMarkdown = parti.slice(2).join('---').trim();
                    }
                }

                // 3. Convertiamo il corpo in HTML pulito tramite Marked.js e lo iniettiamo nella pagina
                document.getElementById('corpo-articolo').innerHTML = marked.parse(corpoMarkdown);

            } catch (error) {
                console.error('Errore:', error);
                document.body.innerHTML = '<h2 style="color: red;">Impossibile caricare l\'articolo.</h2>';
            }
        }

        caricaArticoloCompleto();
    </script>
</body>
</html>
