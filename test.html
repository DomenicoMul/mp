<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Elenco Articoli da Git</title>
</head>
<body>

    <h1>I miei articoli</h1>
    <ul id="lista-articoli">
        <li>Caricamento elenco in corso...</li>
    </ul>

    <script>
        async function caricaElencoArticoli() {
            const ul = document.getElementById('lista-articoli');
            
            try {
                // Endpoint delle API di GitHub per la cartella posts
                const apiUrl = 'https://api.github.com/repos/DomenicoMul/mp/contents/content/posts';
                
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error(`Errore HTTP: ${response.status}`);
                }
                
                const files = await response.json();
                
                // Pulisce il messaggio di caricamento
                ul.innerHTML = '';
                
                // Filtra solo i file .md e crea la lista
                files.forEach(file => {
                    if (file.name.endsWith('.md')) {
                        const li = document.createElement('li');
                        
                        // Creiamo un link per ogni articolo
                        li.innerHTML = `<strong>${file.name}</strong> - <a href="${file.download_url}" target="_blank">Apri file Raw</a>`;
                        
                        ul.appendChild(li);
                    }
                });

            } catch (error) {
                console.error('Errore nel recupero della lista:', error);
                ul.innerHTML = `<li style="color: red;">Impossibile caricare l'elenco dei file.</li>`;
            }
        }

        caricaElencoArticoli();
    </script>
</body>
</html>
