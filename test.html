<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Test CMS</title>
    <!-- Libreria Marked per convertire il Markdown in HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div id="MioContenutoDinamico">
        Caricamento in corso...
    </div>

    <script>
        // Funzione per rimuovere il Frontmatter YAML di Pages CMS
        function rimuoviFrontmatter(markdown) {
            if (markdown.startsWith('---')) {
                const parti = markdown.split('---');
                if (parti.length >= 3) {
                    return parti.slice(2).join('---').trim();
                }
            }
            return markdown;
        }

        async function caricaPaginaMarkdown() {
            try {
                // PERCORSO CORRETTO: 'posts' al plurale!
                const response = await fetch('content/posts/2026-10-05-test2.md');
                
                if (!response.ok) {
                    throw new Error(`Errore HTTP ${response.status}: Impossibile trovare il file`);
                }

                const markdownText = await response.text();
                const markdownPulito = rimuoviFrontmatter(markdownText);

                // Converte in HTML e inserisce nella pagina
                document.getElementById('MioContenutoDinamico').innerHTML = marked.parse(markdownPulito);

            } catch (error) {
                console.error('Dettaglio errore:', error);
                document.getElementById('MioContenutoDinamico').innerHTML = `<p style="color: red;">${error.message}</p>`;
            }
        }

        caricaPaginaMarkdown();
    </script> 
</body>
</html>
