<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Filtra Articoli per Categoria</title>
    <!-- Libreria per leggere il Markdown/Frontmatter -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <h1>Articoli della categoria: <span id="categoria-corrente" style="color: blue;">tecnologia</span></h1>
    <ul id="lista-filtrata">
        <li>Caricamento e filtraggio in corso...</li>
    </ul>

    <script>
        // Funzione di supporto per leggere una proprietà specifica dal Frontmatter YAML
        function estraiValoreFrontmatter(markdown, chiave) {
            const regex = new RegExp(`^${chiave}:\\s*["']?([^"'\n]+)["']?`, 'm');
            const match = markdown.match(regex);
            return match ? match[1].trim() : null;
        }

        async function caricaArticoliPerCategoria(categoriaDesiderata) {
            const ul = document.getElementById('lista-filtrata');
            
            try {
                // 1. Ottiene la lista dei file dalla cartella posts di GitHub
                const apiUrl = 'https://api.github.com/repos/DomenicoMul/mp/contents/content/posts';
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Errore nel recupero della lista file');
                
                const files = await response.json();
                ul.innerHTML = ''; // Pulisce il caricamento
                
                let trovati = 0;

                // 2. Scorre tutti i file e controlla il loro contenuto
                for (const file of files) {
                    if (file.name.endsWith('.md')) {
                        // Scarica il contenuto del singolo file .md
                        const resFile = await fetch(file.download_url);
                        const testoMarkdown = await resFile.text();

                        // Estrae la categoria dal frontmatter (assicurati che nel CMS il campo si chiami 'category' o 'categoria')
                        const categoriaFile = estraiValoreFrontmatter(testoMarkdown, 'category') || estraiValoreFrontmatter(testoMarkdown, 'categoria');
                        const linkImage = estraiValoreFrontmatter(testoMarkdown, 'img-link');
                        const titoloFile = estraiValoreFrontmatter(testoMarkdown, 'title') || estraiValoreFrontmatter(testoMarkdown, 'titolo') || file.name;

               



                        // 3. Filtra confrontando la categoria (ignorando maiuscole/minuscole)
                        if (categoriaFile && categoriaFile.toLowerCase() === categoriaDesiderata.toLowerCase()) {
                            trovati++;
                            const li = document.createElement('li');
                            li.innerHTML = `<strong>${titoloFile}</strong> <a href="${file.download_url}" target="_blank">(Leggi)</a><br><br><img src="${file.download_url}">`;
                            ul.appendChild(li);
                        }
                    }
                }

                if (trovati === 0) {
                    ul.innerHTML = `<li>Nessun articolo trovato per questa categoria.</li>`;
                }

            } catch (error) {
                console.error('Errore:', error);
                ul.innerHTML = `<li style="color: red;">Errore durante il filtraggio dei contenuti.</li>`;
            }
        }

        // Esempio: cerca tutti gli articoli con categoria "tecnologia"
        caricaArticoliPerCategoria('epoidaltronde');
    </script>
</body>
</html>
