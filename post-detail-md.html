    <script>
        // 1. Gestione Navbar trasparente/scrolled
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', function() {
            if (window.scrollY > 40) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // 2. Gestione Menu Mobile Hamburger
        const mobileMenuToggle = document.getElementById('mobileMenuToggle');
        const navMenu = document.getElementById('navMenu');
        const toggleIcon = mobileMenuToggle.querySelector('i');

        mobileMenuToggle.addEventListener('click', function() {
            navMenu.classList.toggle('active');
            if (navMenu.classList.contains('active')) {
                toggleIcon.classList.remove('fa-bars');
                toggleIcon.classList.add('fa-xmark');
            } else {
                toggleIcon.classList.remove('fa-xmark');
                toggleIcon.classList.add('fa-bars');
            }
        });

        document.querySelectorAll('.nav-menu a').forEach(link => {
            link.addEventListener('click', () => {
                navMenu.classList.remove('active');
                toggleIcon.classList.remove('fa-xmark');
                toggleIcon.classList.add('fa-bars');
            });
        });

        // Funzione corretta per estrarre proprietà YAML (supporta anche chiavi con trattini es. img-link)
        function estraiValoreFrontmatter(testo, chiave) {
            // Questa regex cerca il campo e gestisce correttamente stringhe racchiuse tra doppi apici, apici singoli o senza apici
            const regex = new RegExp(`^\\s*${chiave}:\\s*(?:"([^"]*)"|'([^']*)'|([^\\n]+))`, 'm');
            const match = testo.match(regex);
            if (!match) return '';
            // Restituisce il primo gruppo valido trovato (tra doppi apici, apici singoli o testo libero)
            return (match[1] !== undefined ? match[1] : (match[2] !== undefined ? match[2] : match[3])).trim();
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            const nomeFile = urlParams.get('filename'); 

            if (!nomeFile) {
                const corpoEl = document.getElementById('corpo-articolo');
                if(corpoEl) corpoEl.innerHTML = `<p style="color: red;">Nessun file specificato nell'URL.</p>`;
                return;
            }

            await caricaSingoloArticolo(nomeFile);
        });

        async function caricaSingoloArticolo(nomeFile) {
            try {
                const urlFile = `https://raw.githubusercontent.com/DomenicoMul/mp/refs/heads/main/content/posts/${nomeFile}`;
                
                const response = await fetch(urlFile);
                if (!response.ok) throw new Error('Impossibile trovare il file dell\'articolo su GitHub');

                const fileText = await response.text();

                // Estrazione metadati
                const linkImg = estraiValoreFrontmatter(fileText, 'img-link');
                const titolo = estraiValoreFrontmatter(fileText, 'title');
                const sottotitolo = estraiValoreFrontmatter(fileText, 'sub-title');            
                const categoria = estraiValoreFrontmatter(fileText, 'category');
                const data = estraiValoreFrontmatter(fileText, 'date');
                const descrizione = estraiValoreFrontmatter(fileText, 'description');

                // Popolamento elementi HTML
                if (linkImg) {
                    const imgEl = document.getElementById('immagine-articolo');
                    if (imgEl) { 
                        imgEl.src = linkImg; 
                        imgEl.style.display = 'block'; 
                    }
                }

                if (titolo) {
                    const titoloEl = document.getElementById('titolo-articolo');
                    if(titoloEl) titoloEl.innerText = titolo;
                    const pageTitle = document.getElementById('page-title');
                    if(pageTitle) pageTitle.innerText = titolo;
                }
                if (sottotitolo) {
                    const subEl = document.getElementById('sottotitolo-articolo');
                    if(subEl) subEl.innerText = sottotitolo;
                }
                if (categoria) {
                    const catEl1 = document.getElementById('categoria-articolo');
                    if(catEl1) catEl1.innerText = categoria;
                }
                if (data) {
                    const dataEl1 = document.getElementById('data-articolo');
                    if(dataEl1) dataEl1.innerHTML =' <i class="fa-solid fa-chevron-left" onclick="window.history.back(1);" style="cursor:pointer;"></i> <a  onclick="window.history.back(1);" style="cursor:pointer;"> Pagina Precedente</a> | <i class="fa-solid fa-calendar-days"></i> ' + data + '&nbsp;| <i class="fa-solid fa-user"></i> Michele Petrocelli &nbsp';
                    const dataEl2 = document.getElementById('data-articolo-bis');
                    if(dataEl2) dataEl2.innerText = data;
                }
                if (descrizione) {
                    const descEl = document.getElementById('descrizione-articolo');
                    if(descEl) { descEl.innerText = descrizione; descEl.style.display = 'block'; }
                }

                // Pulizia Frontmatter YAML e conversione Markdown
                let corpoMarkdown = fileText;
                if (fileText.startsWith('---')) {
                    const parti = fileText.split('---');
                    if (parti.length >= 3) {
                        corpoMarkdown = parti.slice(2).join('---').trim();
                    }
                }

                const corpoEl = document.getElementById('corpo-articolo');
                if(corpoEl) {
                    corpoEl.innerHTML = marked.parse(corpoMarkdown);
                }

            } catch (error) {
                console.error('Errore:', error);
                const corpoEl = document.getElementById('corpo-articolo');
                if(corpoEl) {
                    corpoEl.innerHTML = `<h2 style="color: red;">Impossibile caricare l'articolo.</h2><p>${error.message}</p>`;
                }
            }
        }
    </script>
